name: Release

# Publishing a version:
#   1. set "_VERSION" in about.json (for example "v2.1.0")
#   2. commit and push to main
#
# Every push to main checks whether that version already has a tag. If it has
# none, the workflow tests the code, builds two packages, boots the Windows
# portable package on a real Windows runner, and only then creates the tag and
# publishes the GitHub release with the packages attached:
#
#   PUBGScoreboard-<version>.zip                    for PHP 7.4+ / Apache / XAMPP users
#   PUBGScoreboard-<version>-windows-portable.zip   PHP included: unzip, run Start.bat
#
# A push that does not bring a new version releases nothing (CI still runs).
#
# Run it by hand (Actions → Release → Run workflow) to do the same without a
# push. Untick "publish" there to only build the packages; they are attached to
# the run as an artifact. Pushing a tag yourself (git tag v2.1.0 && git push
# origin v2.1.0) also still publishes it.

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      publish:
        description: Create the tag and publish the release (untick to only build the packages)
        type: boolean
        default: true
      php_series:
        description: PHP series bundled into the Windows portable package
        default: '8.4'
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  PHP_SERIES: ${{ inputs.php_series || '8.4' }}

jobs:
  plan:
    name: Check the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - name: Decide what to do
        id: plan
        env:
          PUBLISH_INPUT: ${{ inputs.publish }} # empty unless the workflow was run by hand
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Single source of truth for the version: about.json ("_VERSION": "v2.0.0")
          tag="$(jq -r '._VERSION' about.json)"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=about.json::_VERSION must look like v1.2.3 (found: $tag)"
            exit 1
          fi

          publish=true
          why=""
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" != "$tag" ]]; then
              echo "::error file=about.json::Tag $GITHUB_REF_NAME does not match about.json ($tag). Update _VERSION, commit, and move the tag."
              exit 1
            fi
          else
            # --exit-code: 0 = the tag exists, 2 = it does not, anything else = the lookup failed
            found=0
            git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null || found=$?
            if [[ "$found" -eq 0 ]]; then
              publish=false
              why="$tag is already released. To publish a new version, change _VERSION in about.json."
            elif [[ "$found" -ne 2 ]]; then
              echo "::error::Could not read the tags of this repository (git ls-remote exited with $found)"
              exit 1
            elif [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
              publish=false
              why="Releases are only published from $DEFAULT_BRANCH, not from $GITHUB_REF_NAME."
            fi
          fi
          if [[ "$publish" == "true" && "$PUBLISH_INPUT" == "false" ]]; then
            publish=false
            why="Publishing was switched off for this run."
          fi

          # A push without a new version has nothing to build; a run by hand always builds.
          build=true
          if [[ "$publish" == "false" && "$GITHUB_EVENT_NAME" == "push" ]]; then
            build=false
          fi

          if [[ "$publish" == "true" ]]; then
            echo "::notice::Releasing $tag from commit ${GITHUB_SHA::7}"
          elif [[ "$build" == "true" ]]; then
            echo "::notice::$why Building the packages without publishing."
          else
            echo "::notice::$why Nothing to do."
          fi

          {
            echo "version=${tag#v}"
            echo "build=$build"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  test:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    uses: ./.github/workflows/ci.yml

  build:
    name: Build packages
    needs: [plan, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Download PHP ${{ env.PHP_SERIES }} for Windows
        run: |
          # The official feed lists the current patch release of every series, with checksums.
          feed="$(curl -fsSL --retry 5 --retry-delay 3 -A 'PUBGScoreboard-release' https://windows.php.net/downloads/releases/releases.json)"
          read -r path sha < <(jq -r --arg series "$PHP_SERIES" '
            .[$series] // error("PHP series \($series) is not in the release feed")
            | to_entries[] | select(.key | test("^nts-.*-x64$")) | .value.zip | "\(.path) \(.sha256)"' <<< "$feed") || true
          [ -n "${path:-}" ] || { echo "::error::No 64-bit NTS build of PHP $PHP_SERIES in the release feed"; exit 1; }
          echo "Bundling $path"
          curl -fsSL --retry 5 --retry-delay 3 -A 'PUBGScoreboard-release' -o php.zip "https://windows.php.net/downloads/releases/$path"
          echo "$sha  php.zip" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/php"
          unzip -q php.zip -d "$RUNNER_TEMP/php"
          rm php.zip
          echo "PHP_ZIP=$path" >> "$GITHUB_ENV"

      - name: Package
        run: |
          chmod +x .github/scripts/package.sh
          .github/scripts/package.sh --php-dir "$RUNNER_TEMP/php"

      - name: Summary
        run: |
          {
            echo "### PUBG Scoreboard ${{ needs.plan.outputs.version }}"
            echo
            echo "Bundled runtime: \`$PHP_ZIP\`"
            echo
            echo '```'
            ls -l dist
            echo
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0 # the payload is already zipped

  verify-windows:
    name: Boot the portable package on Windows
    needs: [plan, build]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: dist

      - name: Unpack exactly what users will download
        shell: pwsh
        run: |
          $zip = Get-Item "dist/PUBGScoreboard-${{ needs.plan.outputs.version }}-windows-portable.zip"
          Expand-Archive -Path $zip -DestinationPath portable
          $app = Join-Path $PWD 'portable/PUBGScoreboard'

          foreach ($needed in 'Start.bat', 'Start (remote control).bat', 'server.php', 'index.php', 'runtime/php/php.exe', 'runtime/php/license.txt', 'Views/control.html', 'Autoload/translations.json') {
            if (-not (Test-Path (Join-Path $app $needed))) { throw "Missing from the package: $needed" }
          }
          foreach ($excluded in 'tests', '.github', 'Autoload/tournament_data.json', 'Autoload/server.php') {
            if (Test-Path (Join-Path $app $excluded)) { throw "Should not be in the package: $excluded" }
          }
          # cmd.exe misreads labels in batch files that do not use CRLF line endings
          $bat = [IO.File]::ReadAllText((Join-Path $app 'Start.bat'))
          if ($bat -notmatch "`r`n") { throw 'Start.bat lost its CRLF line endings' }

          "APP=$app" >> $env:GITHUB_ENV

      - name: Run the test suites with the bundled PHP
        shell: pwsh
        run: |
          # No PHP is installed by this job: only the runtime inside the package is used.
          Copy-Item -Recurse tests (Join-Path $env:APP 'tests')
          Set-Location $env:APP
          $env:PHP_BIN = Join-Path $env:APP 'runtime/php/php.exe'
          & $env:PHP_BIN -v
          & $env:PHP_BIN tests/api.php
          if ($LASTEXITCODE -ne 0) { throw 'Backend tests failed with the bundled PHP' }
          node tests/server.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Server tests failed with the bundled PHP' }

  publish:
    name: Tag and publish the GitHub release
    needs: [plan, build, verify-windows]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: dist

      - uses: softprops/action-gh-release@v3
        with:
          # Creates the tag on the commit that was tested and packaged, unless it was pushed by hand.
          tag_name: v${{ needs.plan.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: PUBG Scoreboard ${{ needs.plan.outputs.version }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
          body: |
            ## Download

            | Package | For |
            | --- | --- |
            | **`PUBGScoreboard-${{ needs.plan.outputs.version }}-windows-portable.zip`** | Windows streaming PCs. PHP is included — unzip anywhere and double-click **Start.bat**. |
            | `PUBGScoreboard-${{ needs.plan.outputs.version }}.zip` | macOS / Linux (`./start.sh`), or an existing PHP 7.4+ / Apache / XAMPP setup. |

            Then add `http://localhost:8080/scoreboard` to OBS as a **Browser** source (1920 × 1080) — or connect the control panel to OBS and let it do that for you.

            Upgrading from 1.x? Copy your old `Autoload/tournament_data.json` into the new folder, or use **Import** in the control panel; old files are converted automatically.

            `SHA256SUMS.txt` lists the checksums of both packages.
